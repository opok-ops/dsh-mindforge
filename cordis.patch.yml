# dsh-mindforge configuration patch
# Apply with: dsh plugin --profile web add "link:/path/to/dsh-mindforge"

mindforge:
  # Path to MindForge CLI (pip install MindForge, or full path to executable)
  cliPath: MindForge

  # Database path (defaults to ~/.MindForge/data/store/memory.db)
  # dbPath: ~/.MindForge/data/store/memory.db

  # Encryption key file (defaults to ~/.MindForge/data/store/key.bin)
  # keyFile: ~/.MindForge/data/store/key.bin

  # Agent ID used for memory-add/context/recall/reflection/reinforce
  # (v0.2.0: 必须与 MindForge 记录记忆的 source_agent 一致才能召回)
  agentId: default

  # CLI 子进程超时（毫秒）。大库的 memory-context 可能较慢，可按需调大。
  timeoutMs: 30000

  # Storage scope: global | workspace | custom
  storageScope: global

  # Auto-inject relevant memories before each model step
  injectOnStep: true

  # Maximum tokens for injected memory context
  maxContextTokens: 2048

  # Tools registered on ctx.tools (model-callable)
  tools:
    - memory_add
    - memory_search
    - memory_context
    - memory_stats
    - memory_recall
    - memory_reflection
    - memory_reinforce
    - memory_lineage
    - graph_query
    - rerank_search
