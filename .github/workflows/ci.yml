name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests (mock bridge)
        run: npm test

  e2e:
    # 真实桥接 E2E（v3.0.1 引入）：mock 全绿 ≠ 真实可用——2026-11-07
    # 战役发现 MindForge 侧压缩索引从未水合（单测 mock 掩盖），且
    # dsh 侧 CompressResponse 契约与 CLI 真实输出脱节（恒 0 假键）。
    # 本 job 安装真实 MindForge CLI，跑 16 步真实子进程桥接断言。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MindForge CLI (pinned release)
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/opok-ops/MindForge.git@v6.4.0"
          MindForge --version

      - name: Install dependencies
        run: npm ci

      - name: E2E — real-bridge (16 real subprocess assertions)
        run: npx vitest run --config vitest.config.e2e.ts
        env:
          MINDFORGE_CLI: MindForge
